<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aetherforge v10 · pesquisa BioShock 2</title><link rel="stylesheet" href="style.css"><body><svg xmlns="http://www.w3.org/2000/svg" class="root" viewBox="0 0 1920 1200" role="img" aria-labelledby="research-title"><title id="research-title">BioShock 2 · quatro referências inspecionadas, não assets do Aetherforge</title><rect x="0" y="0" width="1920" height="1200" fill="#bfb49e" /><text x="80" y="65" class="brand" >AETHERFORGE</text><text x="80" y="94" class="eyebrow" >V10 · PESQUISA DE BIOSHOCK 2</text><text x="1840" y="60" class="page-title end" >Desenho antes de acabamento</text><text x="1840" y="91" class="small end" >Conceito pintado, função e contraste — não mais maquetes substitutas.</text><rect x="80" y="147" width="420" height="829" fill="#e2d8c3" rx="3"/><text x="97" y="180" class="research-label" >SILHUETA / FRENTE E COSTAS</text><image href="../../../assets/concepts/brass-v10/references/colin-fix-big-sister.jpg" x="94" y="201" width="392" height="613" preserveAspectRatio="xMidYMid meet"/><text x="97" y="853" class="research-author" >Colin Fix · conceito de Big Sister</text><text x="97" y="890" class="research-note" >Proporções e equipamento contam uma função.</text><text x="97" y="916" class="research-note" >Estudar hierarquia, não copiar capacete ou gaiola.</text><rect x="530" y="147" width="420" height="829" fill="#e2d8c3" rx="3"/><text x="547" y="180" class="research-label" >GESTO / ASSIMETRIA</text><image href="../../../assets/concepts/brass-v10/references/colin-fix-crawler.jpg" x="544" y="201" width="392" height="613" preserveAspectRatio="xMidYMid meet"/><text x="547" y="853" class="research-author" >Colin Fix · Ceiling Crawler</text><text x="547" y="890" class="research-note" >Pose e distribuição de massas antes da textura.</text><text x="547" y="916" class="research-note" >Não transplantar máscara, mutação ou personagem.</text><rect x="980" y="147" width="420" height="829" fill="#e2d8c3" rx="3"/><text x="997" y="180" class="research-label" >EQUIPAMENTO / CONSTRUÇÃO</text><image href="../../../assets/concepts/brass-v10/references/colin-fix-mao.jpg" x="994" y="201" width="392" height="613" preserveAspectRatio="xMidYMid meet"/><text x="997" y="853" class="research-author" >Colin Fix · mão do jogador</text><text x="997" y="890" class="research-note" >Couro, metal e tecido têm funções diferentes.</text><text x="997" y="916" class="research-note" >Latão pontual, articulação e desgaste localizado.</text><rect x="1430" y="147" width="420" height="829" fill="#e2d8c3" rx="3"/><text x="1447" y="180" class="research-label" >MATERIAL / CINEMÁTICA</text><image href="../../../assets/concepts/brass-v10/references/james-ku-big-sister.jpg" x="1444" y="201" width="392" height="613" preserveAspectRatio="xMidYMid meet"/><text x="1447" y="853" class="research-author" >James Ku · personagem da cinemática</text><text x="1447" y="890" class="research-note" >Comparar pintura e tradução volumétrica.</text><text x="1447" y="916" class="research-note" >Não é orçamento nem asset de gameplay do idle.</text><text x="80" y="1020" class="research-summary" >ADAPTAR: história de trabalho, assimetria, materiais sóbrios e desenho funcional.</text><text x="80" y="1052" class="research-summary" >PRESERVAR: Guarda com escudo retangular, Pistoleiro, Alquimista e bestiário do GDD.</text><text x="80" y="1100" class="research-note" >Fontes: colinfix.blogspot.com/2009/04/more-bioshock-2-concept-art.html · jameskuart.com/bio2</text><text x="80" y="1167" class="research-note" >Pesquisa de terceiros · direitos dos artistas e titulares. Sem recortes para personagens, texturas ou UI Aetherforge.</text></svg></body></html>
